[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
# Pragmatic, not maximal, strictness: this codebase is symbolic-math-
# heavy (SymPy, SciPy, NumPy), and SymPy in particular ships with no
# meaningful type stubs, so most of its return types are effectively
# Any regardless of config -- chasing full strict mode would mean
# fighting the library, not the code. What IS enforced: no untyped
# function bodies going unchecked (check_untyped_defs), and no
# unnoticed reliance on an Optional value without a narrowing check
# (the union-attr / assignment errors this caught -- see the assert-
# based narrowing added throughout modules/ specifically because of
# this config, not decorative).
#
# CI (see .github/workflows/tests.yml) runs this against EVERYTHING:
# modules/, ui/, app.py, cli.py, config.py and api_server.py -- 0 errors
# across all of it. It used to be scoped to modules/ only, on the theory
# that ui/ leans on st.session_state (dynamically typed, so not worth
# annotating) and would only fail loudly at runtime anyway. Checking it
# anyway showed that theory was wrong on both counts: st.session_state is
# typed Any, so it never caused an error -- the 66 errors were ordinary
# unguarded Optionals and reused variable names, and several were real
# latent crashes (a chain deleted mid-session read as None, a None
# Durbin-Watson compared to a float, a best-fit result with no R-squared
# being sorted). Those fail only on the unlucky input, not "immediately",
# which is exactly what a type checker is for.
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["modules"]

[tool.coverage.report]
# 90%, a few points under the ~94% baseline measured after the last
# coverage pass (it was 84% against a ~87% baseline before that) -- enough
# headroom that routine test additions/removals don't cause flaky CI
# failures, while still catching the case this exists for: a meaningful
# chunk of new code shipping with no test coverage at all.
fail_under = 90
show_missing = true


