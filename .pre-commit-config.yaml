# Optional: complements the GitHub Actions workflow (.github/workflows/tests.yml)
# with immediate LOCAL feedback before a commit even happens, rather than
# only finding out a test broke after pushing. NOTE the full suite is well
# over a thousand tests and takes a few minutes, so running it on every
# commit is a noticeable wait -- to run it on `git push` instead, add
# `stages: [pre-push]` to the hook below and install with
# `pre-commit install --hook-type pre-push`.
#
# Opt in with:
#   pip install pre-commit
#   pre-commit install
#
# After that, `git commit` runs the test suite first and blocks the
# commit if anything fails. Skip it for one commit with `git commit --no-verify`.
repos:
  - repo: local
    hooks:
      - id: pytest
        name: Run test suite
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true
