# Optional local checks, to complement the GitHub Actions workflow (.github/workflows/tests.yml) with feedback BEFORE a
# commit or push exists instead of after.
#
# Opt in once:
#   pip install pre-commit
#   pre-commit install                          # the fast checks, on every `git commit`
#   pre-commit install --hook-type pre-push     # the test suite, on every `git push`
#
# - On commit (a second): refuse to commit unresolved merge-conflict markers -- the check that would have stopped a
#   half-finished merge from reaching origin.
# - On push (a few minutes on one core, much less on several): the test suite, without the handful of tests marked
#   `slow` (CI runs those). Skip for one command with `--no-verify`.
repos:
  - repo: local
    hooks:
      - id: no-conflict-markers
        name: No unresolved merge-conflict markers
        entry: python scripts/check_conflict_markers.py
        language: system
        types: [text]

      - id: pytest
        name: Run test suite (without the slow tests)
        entry: pytest -q -n auto --dist worksteal -m "not slow" -x
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
