# Committed (see .gitignore's exception for this one file -- everything
# else under .streamlit/ stays ignored, e.g. a local secrets.toml).

[server]
# Hard server-side cap (megabytes) on any single file upload -- CSV data
# for curve fitting, PDF worksheets for batch import, or a problem photo.
# Streamlit rejects an over-limit upload before it's fully received,
# rather than the app having to notice and reject it afterward. Paired
# with a second, defense-in-depth check in app.py itself at each
# uploader, which gives a clearer, upload-specific error message than
# Streamlit's own generic rejection.
maxUploadSize = 500

[theme]
# A deliberately chosen default (not Streamlit's bare defaults) for a
# more finished, "someone designed this" first impression -- this is
# the LIGHT theme; the in-app "🌙 Dark mode" sidebar toggle (see app.py)
# overrides these via CSS custom properties at runtime, since Streamlit
# itself only supports switching themes at server startup, not from
# Python code while running.
base = "light"
primaryColor = "#2E5EAA"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F4F9"
textColor = "#1A1A2E"
font = "sans-serif"
